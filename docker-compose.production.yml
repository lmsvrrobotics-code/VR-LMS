# `version:` intentionally omitted — obsolete in Compose v2 and only emits a
# warning. Service names below (redis, auth-service, admin-service, …) double
# as DNS hostnames on the lms-net bridge; that is what every cross-service URL
# resolves through, so no container needs to know another's IP.
services:
  # ==========================================
  # REDIS (Session cache + Rate limiting)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: vrrobotics-redis
    restart: always
    # Not published to the host. Only services on lms-net talk to Redis, and
    # exposing a password-protected cache on 0.0.0.0 is needless attack surface
    # (it also collided with the developer's local/WSL Redis on 6379).
    # Use `docker compose exec redis redis-cli` for admin access.
    expose:
      - "6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - lms-net
    # redis-server runs with --requirepass, so an unauthenticated PING returns
    # NOAUTH and the healthcheck would fail (leaving every depends_on service
    # waiting forever). Authenticate the probe.
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # BASTION GATEWAY
  # ==========================================
  bastion:
    build: ./backend/Bastion-server
    container_name: bastion
    restart: unless-stopped
    # Host port is configurable because 8000 is a popular default and often
    # already taken on a dev machine. The container port stays 8000, so nothing
    # inside lms-net changes. Set BASTION_HOST_PORT in .env to override.
    ports:
      - "${BASTION_HOST_PORT:-8000}:8000"
    environment:
      - NODE_ENV=production
      - SERVICE_PORT=8000
      - BASTION_ALLOWED_ORIGINS=${BASTION_ALLOWED_ORIGINS}
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=8001
      - ASSESSMENT_SERVICE_HOST=assessment-service
      - ASSESSMENT_SERVICE_PORT=8003
      - ADMIN_SERVICE_HOST=admin-service
      # Must match admin-service's own PORT below. admin-service defaults to
      # 5000 (src/config/env.js) — the two values are only ever correct together.
      - ADMIN_SERVICE_PORT=5000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      # Rate limiting
      - RATE_LIMIT_LOGIN=5/1m
      - RATE_LIMIT_API=100/1m
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN}
    # Optional: the explicit `environment:` block above is the source of truth.
    # Without `required: false` compose aborts the whole deploy if the file is
    # absent, which is the wrong failure mode for an optional override.
    env_file:
      - path: ./backend/Bastion-server/.env.production
        required: false
    depends_on:
      - auth-service
      - assessment-service
      - admin-service
      - redis
    networks:
      - lms-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./logs/bastion:/app/logs

  # ==========================================
  # AUTH-SERVICE
  # ==========================================
  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8001
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      # Redis. REDIS_URL is what the live code actually reads
      # (src/cache/redis.js); REDIS_HOST/PORT are kept for the older modules
      # that still reference them. Without REDIS_URL the client silently fell
      # back to redis://localhost:6379 — i.e. the service's own container — and
      # failed with ECONNREFUSED.
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER_CACHE_TTL=300
      # Rate limiting
      - RATE_LIMIT_LOGIN=5/1m
      - RATE_LIMIT_REGISTER=3/10m
      - RATE_LIMIT_REFRESH=10/1m
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=info
      - CORS_ORIGINS=${CORS_ORIGINS}
    env_file:
      - path: ./backend/auth-service/.env.production
        required: false
    expose:
      - "8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lms-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./logs/auth-service:/app/logs

  # ==========================================
  # ASSESSMENT-SERVICE
  # ==========================================
  assessment-service:
    build: ./backend/assessment-service
    container_name: assessment-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8003
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      # Redis. REDIS_URL is what the live code actually reads
      # (src/cache/redis.js); REDIS_HOST/PORT are kept for the older modules
      # that still reference them. Without REDIS_URL the client silently fell
      # back to redis://localhost:6379 — i.e. the service's own container — and
      # failed with ECONNREFUSED.
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=info
    env_file:
      - path: ./backend/assessment-service/.env.production
        required: false
    expose:
      - "8003"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lms-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ==========================================
  # ADMIN-SERVICE
  # ==========================================
  admin-service:
    build: ./backend/admin-service
    container_name: admin-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # 5000 is admin-service's own default (src/config/env.js). Bastion's
      # ADMIN_SERVICE_PORT above must stay in sync with this value.
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      # admin-service refuses to boot without both of these (src/config/env.js):
      # JWT_SECRET signs its own admin tokens, SUPABASE_JWT_SECRET verifies
      # student/teacher tokens. JWT_SECRET was previously not passed at all.
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Redis. REDIS_URL is what the live code actually reads
      # (src/cache/redis.js); REDIS_HOST/PORT are kept for the older modules
      # that still reference them. Without REDIS_URL the client silently fell
      # back to redis://localhost:6379 — i.e. the service's own container — and
      # failed with ECONNREFUSED.
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=info
      # Bunny Stream — names must match src/config/env.js exactly. The previous
      # BUNNY_LIBRARY_ID / BUNNY_API_KEY were read by nothing, so video config
      # would have been silently undefined in production.
      - BUNNY_STREAM_LIBRARY_ID=${BUNNY_STREAM_LIBRARY_ID}
      - BUNNY_STREAM_API_KEY=${BUNNY_STREAM_API_KEY}
      - BUNNY_STREAM_CDN_HOSTNAME=${BUNNY_STREAM_CDN_HOSTNAME}
      # Cloudflare R2 — likewise: env.js reads R2_ACCESS_KEY_ID /
      # R2_SECRET_ACCESS_KEY, not R2_ACCESS_KEY / R2_SECRET_KEY.
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    env_file:
      - path: ./backend/admin-service/.env.production
        required: false
    expose:
      - "5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lms-net
    # localhost is correct HERE: a container healthcheck runs *inside* that
    # container, so it must reach the service on its own loopback. Only
    # cross-service URLs need the compose service name.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - admin_uploads:/app/uploads

  # ==========================================
  # PROMETHEUS (Metrics collection)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - lms-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # GRAFANA (Dashboards)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - lms-net
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lms-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
  admin_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
