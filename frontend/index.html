<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VR Robotics Academy — Live in Future</title>
    <meta name="description" content="VR Robotics Academy offers live robotics, coding, AI, and VR courses. Hands-on curriculum with expert mentors and certified programs." />
    <meta name="author" content="VR Robotics Academy" />

    <!-- Favicons. These are the SQUARE robot-arm mark cropped out of the wide
         logo: the full logo is a 2.65:1 banner, and pointing the icon at it made
         the browser squash the whole lockup (emblem + "VR Robotics" text) into
         the square tab slot, which rendered as an unreadable smear. Served
         locally — the previous remote URL shipped a 1.66 MB PNG on every load.
         og:image below deliberately KEEPS the wide logo: social cards want the
         full lockup, not the icon. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:title" content="VR Robotics Academy — Live in Future" />
    <meta property="og:description" content="Live robotics, coding, AI, and VR courses with expert mentors and certified programs." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VR Robotics Academy" />
    <meta property="og:image" content="https://res.cloudinary.com/dicfqwlfq/image/upload/v1764505259/VR_Robotics_Logo_upscaled_1_rrrrn8.png" />
    <!-- <meta property="og:url" content="https://vrroboticsacademy.com" /> -->

    <!-- Brand fonts: Sora (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>
