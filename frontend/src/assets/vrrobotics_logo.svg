<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0047AB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#globeGradient)"/>

  <!-- Globe circle -->
  <circle cx="100" cy="100" r="60" fill="white" opacity="0.98"/>

  <!-- Simple grid lines for globe effect -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="#1E90FF" stroke-width="2" opacity="0.3"/>

  <!-- Vertical meridian line -->
  <line x1="100" y1="45" x2="100" y2="155" stroke="#1E90FF" stroke-width="1.5" opacity="0.4"/>

  <!-- Horizontal equator line -->
  <line x1="45" y1="100" x2="155" y2="100" stroke="#1E90FF" stroke-width="1.5" opacity="0.4"/>

  <!-- Latitude circles -->
  <ellipse cx="100" cy="100" rx="55" ry="18" fill="none" stroke="#1E90FF" stroke-width="1" opacity="0.3"/>
  <ellipse cx="100" cy="100" rx="55" ry="35" fill="none" stroke="#1E90FF" stroke-width="1" opacity="0.3"/>

  <!-- Simple continent shapes (NO TREE) -->
  <!-- Americas -->
  <path d="M 72 80 Q 75 75 78 82 L 78 95 Q 75 100 72 98 Z" fill="#1E90FF" opacity="0.6"/>

  <!-- Europe/Africa -->
  <path d="M 108 75 Q 115 78 118 90 L 115 105 Q 108 102 105 95 Z" fill="#1E90FF" opacity="0.6"/>

  <!-- Asia -->
  <path d="M 125 85 L 140 88 L 138 105 L 120 100 Z" fill="#1E90FF" opacity="0.6"/>
</svg>
