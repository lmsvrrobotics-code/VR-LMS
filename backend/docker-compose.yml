services:
  bastion:
    build: ./Bastion-server
    container_name: bastion
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./Bastion-server/.env
    environment:
      - SERVICE_PORT=8000
      - BASTION_ALLOWED_ORIGINS=${BASTION_ALLOWED_ORIGINS:-http://localhost:5173}
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=8001
      - ASSESSMENT_SERVICE_HOST=assessment-service
      - ASSESSMENT_SERVICE_PORT=8003
      - ADMIN_SERVICE_HOST=admin-service
      - ADMIN_SERVICE_PORT=8007
    depends_on:
      - auth-service
      - assessment-service
      - admin-service
    networks:
      - lms-net

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    environment:
      - PORT=8001
    expose:
      - "8001"
    networks:
      - lms-net

  assessment-service:
    build: ./assessment-service
    container_name: assessment-service
    restart: unless-stopped
    env_file:
      - ./assessment-service/.env
    environment:
      - PORT=8003
    expose:
      - "8003"
    networks:
      - lms-net

  admin-service:
    build: ./admin-service
    container_name: admin-service
    restart: unless-stopped
    env_file:
      - ./admin-service/.env
    environment:
      - PORT=8007
    expose:
      - "8007"
    volumes:
      - admin_uploads:/app/uploads
    networks:
      - lms-net

networks:
  lms-net:
    driver: bridge

volumes:
  admin_uploads:
